<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>KaWee — Realistic Space Arena</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:#eef4ff;font-family:Inter,system-ui,Arial}canvas{position:fixed;inset:0;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(#02040acc,transparent);font-weight:700}.logo{letter-spacing:4px;font-size:22px}.room{padding:7px 12px;border:1px solid #ffffff33;border-radius:999px;background:#07101bcc}.players{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.card{min-width:90px;padding:6px 10px;border:1px solid #ffffff22;border-radius:10px;background:#06101ddd;font-size:12px;text-align:center}.arenaUI{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(920px,94vw);pointer-events:auto}.question{padding:14px 18px;margin-bottom:10px;border:1px solid #ffffff22;border-radius:16px;background:linear-gradient(135deg,#07111eeb,#030712eb);box-shadow:0 15px 50px #0008;font-size:clamp(15px,2.1vw,22px);font-weight:700;text-align:center}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ans,button{border:1px solid #ffffff26;background:#0b1828e8;color:white;border-radius:12px;padding:12px;cursor:pointer;font-weight:700}.ans:hover{background:#18324e}.controls{display:flex;gap:10px;justify-content:center;margin-top:9px}.jet{min-width:180px;background:linear-gradient(135deg,#173b58,#0b1727);}.status{text-align:center;font-size:12px;color:#b8c7dc;margin-top:6px}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#01030bcc;z-index:4}.panel{width:min(430px,90vw);padding:25px;border:1px solid #ffffff22;border-radius:20px;background:#07101ff2;box-shadow:0 25px 100px #000}.panel h1{margin-top:0}.panel input{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #ffffff22;background:#020711;color:white}.panel button{width:100%;margin-top:8px;background:#174b70}.win{position:fixed;inset:0;display:none;place-items:center;background:#02040acc;z-index:5}.winbox{padding:35px;text-align:center;border:1px solid #ffffff2b;border-radius:22px;background:#081426}.hidden{display:none!important}@media(max-width:600px){.answers{grid-template-columns:1fr}.card{min-width:72px}.arenaUI{bottom:8px}.question{padding:10px}.ans{padding:10px}}
</style></head><body><canvas id="space"></canvas><div class="hud"><div class="top"><div class="logo">KAWEE</div><div class="players" id="players"></div><div class="room" id="room">OFFLINE</div></div><div class="arenaUI"><div class="question" id="q">Connect to enter the arena.</div><div class="answers" id="answers"></div><div class="controls"><button class="jet" id="jet" disabled>JETPACK — WAITING</button></div><div class="status" id="status">Answer correctly, then time your flight to the next asteroid.</div></div></div><div class="modal" id="join"><div class="panel"><h1>KaWee</h1><p>Realistic Space Arena</p><input id="name" placeholder="Your astronaut name" maxlength="16"><input id="code" placeholder="Room code (blank = new room)" maxlength="6"><button id="start">ENTER ARENA</button></div></div><div class="win" id="win"><div class="winbox"><h1 id="winText">WINNER</h1><p>+1 ⭐</p><button onclick="location.reload()">NEXT ROUND</button></div></div><script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script><script>
const socket=io();let ready=false,canFly=false,me='';const $=id=>document.getElementById(id);function setQ(q,a){$('q').textContent=q;$('answers').innerHTML='';a.forEach((x,i)=>{const b=document.createElement('button');b.className='ans';b.textContent=x.text;b.onclick=()=>{if(!ready)return;ready=false;[...$('answers').children].forEach(z=>z.disabled=true);socket.emit('answer',{index:i,original:x.original})};$('answers').appendChild(b)})}
$('start').onclick=()=>{me=$('name').value.trim()||'Player';socket.emit('join',{name:me,room:$('code').value.trim()})};socket.on('state',d=>{ready=true;$('room').textContent='ROOM '+d.room;$('players').innerHTML=Object.values(d.players).map(p=>`<div class="card">${p.name}<br>⭐ ${p.stars} · ${p.points}/10</div>`).join('')});socket.on('question',d=>setQ(d.q,d.a));socket.on('nextQuestion',d=>setQ(d.q,d.a));socket.on('answerResult',d=>{$('status').textContent=d.correct?'Correct! Jetpack unlocked — launch and land on the asteroid.':'Wrong answer. Wait for the next question.'});socket.on('flightReady',()=>{canFly=true;$('jet').disabled=false;$('jet').textContent='JETPACK — LAUNCH';$('status').textContent='Press launch. Your astronaut will attempt to reach the next asteroid.'});$('jet').onclick=()=>{if(!canFly)return;canFly=false;$('jet').disabled=true;$('jet').textContent='JETPACK — FLYING';$('status').textContent='Flight in progress…';const success=Math.random()>.28;animateFlight(success);setTimeout(()=>socket.emit('flight',{success}),1700)};socket.on('winner',d=>{$('winText').textContent=d.name+' WINS!';$('win').style.display='grid'});socket.on('errorMsg',m=>alert(m));
// Cinematic 3D space scene
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040a,.006);const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,3000);cam.position.set(0,10,34);const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('space'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;scene.background=new THREE.Color(0x02040a);scene.add(new THREE.AmbientLight(0x6d7fa0,.55));const key=new THREE.DirectionalLight(0xdce8ff,2.4);key.position.set(-20,30,20);key.castShadow=true;scene.add(key);
function stars(){const g=new THREE.BufferGeometry(),n=2200,p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*1800;p[i*3+1]=(Math.random()-.5)*1000;p[i*3+2]=-Math.random()*1500}g.setAttribute('position',new THREE.BufferAttribute(p,3));const m=new THREE.PointsMaterial({color:0xffffff,size:.9,sizeAttenuation:true});scene.add(new THREE.Points(g,m))}stars();
function asteroid(x,y,z,s){const g=new THREE.IcosahedronGeometry(s,2);const pos=g.attributes.position;for(let i=0;i<pos.count;i++){const v=new THREE.Vector3().fromBufferAttribute(pos,i);v.multiplyScalar(0.82+Math.random()*.35);pos.setXYZ(i,v.x,v.y,v.z)}g.computeVertexNormals();const m=new THREE.MeshStandardMaterial({color:0x4b5057,roughness:.95,metalness:.05});const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.rotation.set(Math.random(),Math.random(),Math.random());o.castShadow=o.receiveShadow=true;scene.add(o);return o}const rocks=[];for(let i=0;i<16;i++)rocks.push(asteroid((Math.random()-.5)*55,(Math.random()-.5)*22,(i*-45)-20,3+Math.random()*4));
// astronaut proxy built from detailed primitive parts
const astronaut=new THREE.Group();const suit=new THREE.MeshStandardMaterial({color:0xd8dde3,roughness:.65});const dark=new THREE.MeshStandardMaterial({color:0x18212b,roughness:.5});const visor=new THREE.MeshStandardMaterial({color:0x081522,metalness:.65,roughness:.2});const body=new THREE.Mesh(new THREE.CapsuleGeometry(1,1.6,8,16),suit);body.castShadow=true;astronaut.add(body);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.82,24,16),suit);helmet.position.y=1.65;helmet.castShadow=true;astronaut.add(helmet);const glass=new THREE.Mesh(new THREE.SphereGeometry(.58,24,12),visor);glass.scale.set(1,.62,.55);glass.position.set(0,1.68,.55);astronaut.add(glass);for(const x of [-.48,.48]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.2,1.15,6,10),suit);arm.position.set(x,.35,0);arm.rotation.z=x<0?.25:-.25;astronaut.add(arm);const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.24,1.2,6,10),suit);leg.position.set(x*.65,-1.25,0);astronaut.add(leg)}const pack=new THREE.Mesh(new THREE.BoxGeometry(.75,1.2,.35),dark);pack.position.set(0,.35,-.55);astronaut.add(pack);const flameMat=new THREE.MeshBasicMaterial({color:0xffa62b});for(const x of [-.23,.23]){const f=new THREE.Mesh(new THREE.ConeGeometry(.12,.65,10),flameMat);f.rotation.x=Math.PI;f.position.set(x,-.25,-.75);astronaut.add(f)}astronaut.position.set(0,-1,12);scene.add(astronaut);
function animateFlight(success){let t=0;const start=astronaut.position.clone(),target=start.clone().add(new THREE.Vector3(success?0:0,success?2:-4,success?-25:-9));function step(){t+=.035;const e=Math.sin(Math.min(t,1)*Math.PI);astronaut.position.lerpVectors(start,target,Math.min(t,1));astronaut.rotation.z=Math.sin(t*12)*.08; if(t<1)requestAnimationFrame(step);else{astronaut.position.set(success?0:0,success?1:-4,success?-13:3);astronaut.rotation.z=0}}step()}
function loop(){requestAnimationFrame(loop);rocks.forEach((r,i)=>{r.rotation.x+=.0008*(i%3+1);r.rotation.y+=.001});renderer.render(scene,cam)}loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
